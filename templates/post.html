<!DOCTYPE html>
<html
  th:replace="~{modules/layout :: html (title = ${post.spec.title},
    description = ${post.status.excerpt},
    active = 'post',
    variant = 'inner',
    content = ~{::content})}"
  xmlns:th="https://www.thymeleaf.org"
>
  <th:block th:fragment="content">
    <th:block th:with="author = ${post.owner}">
      <div class="container">
        <div class="post-layout" th:classappend="${theme.config.post.toc_enabled ? '' : 'post-layout--single'}">
          <!-- 正文 -->
          <article>
            <header>
              <p class="post-kicker">
                <span th:each="cat : ${post.categories}">
                  <a th:href="${cat.status?.permalink}" th:text="${cat.spec.displayName}"></a>
                </span>
                <span class="sep" th:if="${!#lists.isEmpty(post.categories)}">/</span>
                <span th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"></span>
              </p>
              <h1 class="post-title" th:text="${post.spec.title}"></h1>
              <p class="post-excerpt" th:if="${!#strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}"></p>
              <div class="post-meta">
                <span th:if="${author != null}">作者 · [[${author.displayName}]]</span>
                <span th:if="${post.spec.pinned}">置顶</span>
                <span th:if="${post.stats != null && post.stats.visit != null}">阅读 · [[${post.stats.visit}]]</span>
                <span>修订 · [[${#dates.format(post.status.lastModifyTime, 'yyyy-MM-dd')}]]</span>
              </div>
            </header>

            <div class="post-content" th:utext="${post.content.content}"></div>

            <!-- 版权声明 -->
            <div class="post-copyright" th:if="${!#strings.isEmpty(theme.config.post.copyright)}">
              <div class="copyright-title">COPYRIGHT</div>
              <p th:text="${theme.config.post.copyright}"></p>
            </div>

            <!-- 上下篇 -->
            <nav class="post-nav" th:if="${postCursor != null}" aria-label="文章导航">
              <a
                class="post-nav-link"
                th:classappend="${postCursor.previous == null ? 'is-empty' : ''}"
                th:href="${postCursor.previous != null ? postCursor.previous.status.permalink : '#'}"
              >
                <span class="pn-label">← PREV</span>
                <span class="pn-title" th:text="${postCursor.previous != null ? postCursor.previous.spec.title : ''}"></span>
              </a>
              <a
                class="post-nav-link is-next"
                th:classappend="${postCursor.next == null ? 'is-empty' : ''}"
                th:href="${postCursor.next != null ? postCursor.next.status.permalink : '#'}"
              >
                <span class="pn-label">NEXT →</span>
                <span class="pn-title" th:text="${postCursor.next != null ? postCursor.next.spec.title : ''}"></span>
              </a>
            </nav>

            <!-- 相关文章 -->
            <div class="related-posts" th:if="${!#lists.isEmpty(post.categories)}">
              <th:block th:with="recommend = ${postFinder.listByCategory(1, theme.config.post.related_count + 1, post.categories[0].metadata.name)}">
                <div class="related-title" th:if="${recommend != null && !#lists.isEmpty(recommend.items)}">RELATED · 相关阅读</div>
                <div class="article-list" th:if="${recommend != null && !#lists.isEmpty(recommend.items)}">
                  <a
                    class="article-row"
                    th:each="rp, iter : ${recommend.items}"
                    th:if="${rp.metadata.name != post.metadata.name}"
                    th:href="${rp.status.permalink}"
                  >
                    <span class="row-no" th:text="${#numbers.formatInteger(iter.count, 2)}"></span>
                    <span class="row-main">
                      <span class="row-title" th:text="${rp.spec.title}"></span>
                      <span class="row-cats">
                        <th:block th:each="cat, catIter : ${rp.categories}">
                          <th:block th:if="${catIter.index > 0}"> · </th:block>[[${cat.spec.displayName}]]
                        </th:block>
                      </span>
                    </span>
                    <span class="row-date" th:text="${#dates.format(rp.spec.publishTime, 'yyyy-MM-dd')}"></span>
                    <span class="row-arrow" aria-hidden="true">→</span>
                  </a>
                </div>
              </th:block>
            </div>

            <!-- 评论 -->
            <div class="post-comment" th:if="${theme.config.global.comment_enabled}">
              <div class="related-title">COMMENTS · 评论</div>
              <div id="comment">
                <halo:comment
                  group="content.halo.run"
                  kind="Post"
                  th:attr="name=${post.metadata.name}"
                />
              </div>
            </div>
          </article>

          <!-- 目录：桌面侧栏 / 移动端折叠面板 -->
          <details class="post-toc" id="postToc" th:if="${theme.config.post.toc_enabled}" aria-label="文章目录" open>
            <summary class="toc-title">CONTENTS</summary>
            <div class="toc-list"></div>
          </details>
        </div>
      </div>
    </th:block>
  </th:block>
</html>
