<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
  <!-- 分页：path 为列表前缀（如 /archives），posts 为 ListResult -->
  <nav class="pagination" th:fragment="pagination(path, posts)" aria-label="分页导航">
    <a
      th:href="${posts.hasPrevious ? posts.prevUrl : '#'}"
      th:classappend="${posts.hasPrevious ? '' : 'is-disabled'}"
      aria-label="上一页"
      >←</a
    >
    <th:block th:each="index : ${#numbers.sequence(1, posts.totalPages)}">
      <a
        th:if="${posts.totalPages <= 7 || index == 1 || index == posts.totalPages || (index >= posts.page - 1 && index <= posts.page + 1)}"
        th:href="${path + '/page/' + index}"
        th:classappend="${posts.page == index ? 'is-current' : ''}"
        th:text="${index}"
      ></a>
      <span
        th:if="${posts.totalPages > 7 && (index == 1 || index == posts.totalPages) && (posts.page - index > 2 || index - posts.page > 2)}"
        >…</span
      >
    </th:block>
    <a
      th:href="${posts.hasNext ? posts.nextUrl : '#'}"
      th:classappend="${posts.hasNext ? '' : 'is-disabled'}"
      aria-label="下一页"
      >→</a
    >
  </nav>
</html>
