<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  lang="zh-CN"
  data-theme="light"
  th:fragment="html (title, description, active, variant, content)"
>
  <th:block th:replace="~{modules/head :: head(${title}, ${description})}" />

  <body>
    <div class="progress-bar" id="progressBar" aria-hidden="true"></div>

    <!-- ==================== 顶部信息条 ==================== -->
    <div class="utility-bar">
      <div class="container ub-inner">
        <span
          id="todayLine"
          th:with="now=${#temporals.createNow()}"
          th:text="${#temporals.format(now, 'yyyy年M月d日') + ' · 星期' + {'日','一','二','三','四','五','六'}[#temporals.dayOfWeek(now) % 7] + ' · 第' + T(java.time.temporal.IsoFields).WEEK_OF_WEEK_BASED_YEAR.getFrom(now) + '周'}"
          >—</span
        >
        <div class="ub-links">
          <th:block th:each="s : ${theme.config.global.socials}">
            <a
              th:href="${s.url}"
              th:text="${s.name}"
              th:classappend="${#strings.startsWith(s.url, 'mailto:') ? 'ub-hide' : ''}"
              th:target="${#strings.startsWith(s.url, 'mailto:') ? '' : '_blank'}"
              rel="noopener"
            ></a>
          </th:block>
          <button class="icon-btn" id="themeToggle" aria-label="切换深浅主题" title="切换深浅主题">
            <svg
              class="ic-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg
              class="ic-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== 报头（全站统一尺寸） ==================== -->
    <header class="masthead">
      <div class="container masthead-inner">
        <a
          class="wordmark"
          th:href="${site.url}"
          th:utext="${theme.config.global.wordmark != null && !#strings.isEmpty(theme.config.global.wordmark) ? theme.config.global.wordmark : site.title}"
          >boommanpro<span class="dot">.</span></a
        >
        <div class="masthead-side">
          <span class="masthead-tagline" th:text="${theme.config.global.masthead_tagline}"></span>
          <span class="masthead-vol" th:text="${theme.config.global.masthead_vol}"></span>
        </div>
      </div>
    </header>

    <!-- ==================== 导航 ==================== -->
    <nav class="site-nav" aria-label="页面导航">
      <div class="container nav-inner">
        <!-- 站点导航：后台「主菜单」（首页与内页统一结构，支持子菜单） -->
        <th:block th:with="menu = ${menuFinder.getPrimary()}">
          <th:block th:if="${menu != null}">
            <div class="nav-item" th:each="item : ${menu.menuItems}">
              <a
                class="nav-link"
                th:classappend="${#strings.contains(item.status.href, active) ? 'is-active' : ''}"
                th:href="${item.status.href}"
                th:attr="target=${item.spec.target != null && item.spec.target.value == '_blank'} ? '_blank' : null, rel=${item.spec.target != null && item.spec.target.value == '_blank'} ? 'noopener' : null, aria-haspopup=${item.children != null && !#lists.isEmpty(item.children)} ? 'true' : null, aria-expanded=${item.children != null && !#lists.isEmpty(item.children)} ? 'false' : null"
              >
                <span class="n" th:if="${item.metadata.annotations != null && item.metadata.annotations['icon'] != null}" th:text="${item.metadata.annotations['icon']}"></span><span th:text="${item.displayName}"></span><span class="caret" th:if="${item.children != null && !#lists.isEmpty(item.children)}" aria-hidden="true">▾</span>
              </a>
              <div class="nav-drop" th:if="${item.children != null && !#lists.isEmpty(item.children)}">
                <a
                  class="nav-drop-link"
                  th:each="child : ${item.children}"
                  th:classappend="${#strings.contains(child.status.href, active) ? 'is-active' : ''}"
                  th:href="${child.status.href}"
                  th:attr="target=${child.spec.target != null && child.spec.target.value == '_blank'} ? '_blank' : null, rel=${child.spec.target != null && child.spec.target.value == '_blank'} ? 'noopener' : null"
                >
                  <span th:text="${child.displayName}"></span>
                </a>
              </div>
            </div>
          </th:block>
          <th:block th:if="${menu == null}">
            <a class="nav-link" th:href="${site.url}" th:classappend="${active == 'home' ? 'is-active' : ''}"><span class="n">00</span>首页</a>
            <a class="nav-link" th:href="@{/archives}" th:classappend="${active == 'archives' ? 'is-active' : ''}"><span class="n">01</span>归档</a>
            <a class="nav-link" th:href="@{/categories}" th:classappend="${active == 'categories' ? 'is-active' : ''}"><span class="n">02</span>分类</a>
            <a class="nav-link" th:href="@{/tags}" th:classappend="${active == 'tags' ? 'is-active' : ''}"><span class="n">03</span>标签</a>
          </th:block>
        </th:block>
        <!-- 首页：期刊滚动栏目指示 -->
        <span class="nav-current" id="navCurrent" th:if="${variant == 'home'}">—</span>
      </div>
    </nav>

    <main id="top">
      <th:block th:replace="${content}" />
    </main>

    <!-- ==================== 页脚 ==================== -->
    <footer class="site-footer">
      <div class="container">
        <div class="footer-grid">
          <div>
            <div
              class="f-wordmark"
              th:with="wm=${theme.config.global.wordmark != null && !#strings.isEmpty(theme.config.global.wordmark) ? theme.config.global.wordmark : site.title}"
            >
              <span th:text="${#strings.substring(wm, 0, #strings.length(wm) - 1)}">boommanpro</span><span th:text="${#strings.substring(wm, #strings.length(wm) - 1)}">.</span>
            </div>
            <p class="f-tagline" th:text="${theme.config.footer.tagline}"></p>
          </div>
          <div class="f-links">
            <th:block th:each="s : ${theme.config.global.socials}">
              <a th:href="${s.url}" th:text="${#strings.toUpperCase(s.name)}"></a>
            </th:block>
            <a th:href="@{/rss.xml}">RSS</a>
          </div>
        </div>
        <div class="f-bottom">
          <span>
            © <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
            <span th:text="${#strings.toUpperCase(#strings.replace(theme.config.global.wordmark != null ? theme.config.global.wordmark : site.title, '.', ''))}">BOOMMANPRO</span>
            · <span th:text="${theme.config.footer.bottom_left}"></span>
          </span>
          <span>
            <span th:text="${theme.config.footer.bottom_right}"></span>
            <th:block th:if="${!#strings.isEmpty(theme.config.global.icp)}">
              ·
              <a th:href="'https://beian.miit.gov.cn/'" target="_blank" rel="noopener" th:text="${theme.config.global.icp}"></a>
            </th:block>
            · <a href="#top">返回顶部 ↑</a>
          </span>
        </div>
      </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">↑</button>
  </body>
</html>
