<!DOCTYPE html>
<html
  th:replace="~{modules/layout :: html (title = ${singlePage.spec.title},
    description = ${singlePage.status.excerpt},
    active = 'journey',
    variant = 'inner',
    content = ~{::content})}"
  xmlns:th="https://www.thymeleaf.org"
>
  <th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/plugins/JourneyHome/assets/street.css}" />

    <style>
      /* ============================================================
         纸墨旅程 3D（Paper & Ink Journey 3D）
         全屏内嵌版：整个内容区即 3D 小街，背景与主题页面无缝融合
         ============================================================ */
      .j-street-full {
        /* 突破主题 container 宽度，占满全屏宽 */
        width: 100vw;
        position: relative;
        left: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        /* 让 100vw 不产生横向滚动（规避滚动条宽度） */
        box-sizing: border-box;
      }
      .j-street-full .journey-street {
        height: min(88svh, 940px);
        min-height: 480px;
        display: block;
      }

      @media (max-width: 680px) {
        .j-street-full .journey-street {
          height: 82svh;
          min-height: 440px;
        }
      }
    </style>

    <section class="j-street-full" aria-label="交互式旅程">
      <div id="journey-street" class="journey-street" aria-label="3D 纸墨小街：拖动环顾，点击建筑阅读">
        <noscript>启用 JavaScript 才能漫步这条 3D 小街。</noscript>
      </div>
    </section>

    <script type="module" th:src="@{/plugins/JourneyHome/assets/street.js}"></script>
  </th:block>
</html>
